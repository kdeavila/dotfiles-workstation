# =============================================================================
#  ESTACIÓN DE TRABAJO — fuente única de verdad
#  Generador: ~/.config/theme/apply-theme.sh
# =============================================================================
#  PRINCIPIO: el CROMO es monocromo y calla. El CONTENIDO tiene color.
#  El sistema no compite con lo que estás mirando. Esa es toda la idea.
#
#  v2 — base casi-negra neutral, proporciones de la paleta Apple dark
#  (systemGray6 #1C1C1E / gray5 #2C2C2E / gray4 #3A3A3C) pero un escalón
#  más oscuros: en OLEDs se ve negra de verdad y en el TN (350:1) sigue
#  sin levantar gris sucio. Texto neutralizado (adiós tinte azulado).
# =============================================================================

# ---------- CROMO: barra, menús, notificaciones, bordes ----------
# Superficies (grises neutrales, <2% de croma)
base="#0c0d10"          # fondo de barra y de ventana (casi negro)
surface="#16171b"       # elevación 1
elevated="#1f2024"      # elevación 2 / hover

# Texto (tres niveles, y nada más)
text="#e3e4e8"          # ~14.5:1  primario
text_dim="#9b9ca3"      #  ~6.5:1  secundario
text_faint="#7d7e85"    #  ~4.7:1  terciario / inactivo

# ÉNFASIS POR INVERSIÓN, no por color.
# El workspace activo y la fecha son cajas BLANCAS con texto oscuro.
fill="#f2f3f5"          # relleno blanco de los chips
on_fill="#0c0d10"       # texto sobre el relleno blanco

# Azul reservado para foco de ventana y selección. NO va en la barra.
accent="#6ea8fe"        #  7.4:1
on_accent="#0d0f13"

# Estados. Solo aparecen cuando algo va mal. No decoran.
warning="#d9a25f"       #  7.7:1  batería baja
urgent="#e5686f"        #  5.5:1  crítico / sin red

# Bordes: sólidos, sin degradados
border="#292a2f"
# borde de la ventana enfocada: claramente visible sin gritar
border_active="#66666e"

# ---------- CONTENIDO: terminal ----------
# El terminal es CONTENIDO, no cromo: aquí el color SÍ va, porque la
# sintaxis necesita distinguirse. Es la misma lógica por la que Spotify
# conserva su verde dentro de una ventana de macOS.
term_bg="#0c0d10"
term_fg="#e3e4e8"
term_black="#1f2024"
term_red="#e5686f"
term_green="#8fc98a"
term_yellow="#d9a25f"
term_blue="#6ea8fe"
term_magenta="#b49ae0"
term_cyan="#77c2c9"
term_white="#c6c7cd"
