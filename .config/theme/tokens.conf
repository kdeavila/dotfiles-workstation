# =============================================================================
#  ESTACIÓN DE TRABAJO — fuente única de verdad
#  Generador: ~/.config/theme/apply-theme.sh
# =============================================================================
#  PRINCIPIO: el CROMO es monocromo y calla. El CONTENIDO tiene color.
#  El sistema no compite con lo que estás mirando. Esa es toda la idea.
#
#  Calibrado para el panel del ThinkPad E14 Gen 3:
#  TN, 63.8% sRGB, ~350:1 de contraste, 157 PPI.
#  Sin negro puro: con 350:1 se levanta a gris sucio. La base va elevada
#  y la jerarquía la hacen el espacio y el peso, no negros absolutos.
# =============================================================================

# ---------- CROMO: barra, rofi, notificaciones, bordes, menús ----------
# Superficies (croma <5%, prácticamente neutro)
base="#111318"          # fondo de barra y de ventana
surface="#1c2027"       # elevación 1
elevated="#272c34"      # elevación 2 / hover

# Texto (tres niveles, y nada más)
text="#dfe3e8"          # 13.5:1  primario
text_dim="#9aa1ab"      #  6.7:1  secundario
text_faint="#7b828d"    #  4.6:1  terciario / inactivo

# ÉNFASIS POR INVERSIÓN, no por color.
# El workspace activo y la fecha son cajas BLANCAS con texto oscuro.
# Es lo que hace la referencia: el "acento" es el blanco, no un tono.
fill="#f2f4f6"          # relleno blanco de los chips
on_fill="#111318"       # texto sobre el relleno blanco

# Azul reservado para foco de ventana y selección. NO va en la barra.
accent="#6ea8fe"        #  7.4:1
on_accent="#0d0f13"

# Estados. Solo aparecen cuando algo va mal. No decoran.
warning="#d9a25f"       #  7.7:1  batería baja
urgent="#e5686f"        #  5.5:1  crítico / sin red

# Bordes: sólidos, sin degradados
border="#333a44"
# borde de la ventana enfocada: claramente visible sin gritar
border_active="#6b7787"

# ---------- CONTENIDO: terminal ----------
# El terminal es CONTENIDO, no cromo: aquí el color SÍ va, porque la
# sintaxis necesita distinguirse. Es la misma lógica por la que Spotify
# conserva su verde dentro de una ventana de macOS.
term_bg="#111318"
term_fg="#dfe3e8"
term_black="#2a2f37"
term_red="#e5686f"
term_green="#8fc98a"
term_yellow="#d9a25f"
term_blue="#6ea8fe"
term_magenta="#b49ae0"
term_cyan="#77c2c9"
term_white="#c3c9d1"
