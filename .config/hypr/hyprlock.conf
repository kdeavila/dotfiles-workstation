# hyprlock — Screen Lock
# Paleta: tokens "estación de trabajo" (~/.config/theme/tokens.conf)
# base #111318 · text #dfe3e8 · accent #6ea8fe · border #333a44 · urgent #e5686f

$font = SF Pro Display, JetBrainsMono Nerd Font

general {
    hide_cursor = false
}

# Animaciones suaves
animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

# Fondo: screenshot del wallpaper actual + blur
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
}

# Campo de entrada de contraseña
input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 2
    inner_color = rgba(12, 13, 16, 0.0)  # base transparente

    # Acento para el borde (input ok)
    outer_color = rgba(110, 168, 254, 0.90) rgba(110, 168, 254, 0.90) 45deg

    # Texto (contraseña correcta)
    check_color = rgba(227, 228, 232, 0.90) rgba(227, 228, 232, 0.90) 0deg

    # Urgent (fallo de autenticación)
    fail_color = rgba(229, 104, 111, 0.90) rgba(229, 104, 111, 0.90) 0deg

    font_color = rgb(227, 228, 232)  # text
    fade_on_empty = true
    rounding = 4

    font_family = $font
    font_size = 13
    placeholder_text = Password:
    fail_text = <b>Access denied</b> ($ATTEMPTS failed)

    dots_spacing = 0.3
    dots_text_format = •

    position = 0, -20
    halign = center
    valign = center
}

# HORA
label {
    monitor =
    text = $TIME
    font_size = 80
    font_family = $font
    font_color = rgb(227, 228, 232)  # text

    position = -30, 0
    halign = right
    valign = top
}

# FECHA
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y"
    font_size = 22
    font_family = $font
    font_color = rgb(155, 156, 163)  # text_dim

    position = -30, -150
    halign = right
    valign = top
}

# LAYOUT DE TECLADO — bajo el campo de entrada (antes colisionaba con él)
label {
    monitor =
    text = $LAYOUT[es,en]
    font_size = 18
    font_family = $font
    font_color = rgb(110, 168, 254)  # accent
    onclick = hyprctl switchxkblayout all next

    position = 0, -90
    halign = center
    valign = center
}
