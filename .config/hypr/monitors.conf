# MONITORES — la GUI (nwg-displays) reescribe este archivo al aplicar "Apply".
# hyprland.conf lo carga (source). Hyprland aplica estas líneas automáticamente
# al conectar cada pantalla — NO hace falta ningún daemon.

# Laptop: 1600x900 lógicos (panel 157 PPI, escala 1.2)
monitor=eDP-1,1920x1080@60,0x0,1.2

# TV 4K: extendida a la derecha del laptop, escala 1.5
monitor=HDMI-A-1,3840x2160@60,1600x0,1.5

# fallback para pantallas desconocidas (proyector, etc.)
monitor=,preferred,auto,1
