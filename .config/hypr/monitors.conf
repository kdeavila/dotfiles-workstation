# MONITORES — gestionado por nwg-displays (GUI) y kanshi (perfiles automáticos)
# Este archivo LO CARGA hyprland.conf (source). Editar aquí o con nwg-displays.
#
# Escala 1.2 -> 1600x900 logicos. El panel es 157 PPI reales; a escala 1 todo
# quedaba 1.57x mas pequeno que la referencia comoda.
# 1.15 NO es valido: 1920/1.15 no da entero. Validos: 1.2 (1600x900), 1.25 (1536x864).
monitor=eDP-1,1920x1080@60,0x0,1.2
# fallback para monitores externos (kanshi aplica perfiles por encima de esto)
monitor=,preferred,auto,1
