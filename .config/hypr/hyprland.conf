# ==============================================================================
#                     HYPRLAND CONFIGURATION (MODULAR & DEV)
# ==============================================================================

# --- TEMA DINÁMICO ---
source = ~/.config/hypr/themes/current.conf

# --- MONITORES ---
# Escala 1.2 -> 1600x900 logicos. El panel es 157 PPI reales; a escala 1 todo
# quedaba 1.57x mas pequeno que la referencia comoda.
# 1.15 NO es valido: 1920/1.15 no da entero. Validos: 1.2 (1600x900), 1.25 (1536x864).
monitor=eDP-1,1920x1080@60,0x0,1.2
# fallback para monitores externos
monitor=,preferred,auto,1

# --- APLICACIONES PRINCIPALES ---
$terminal = ghostty
$terminalAlt = kitty
$fileManager = dolphin
$browser = brave
$browserAlt = firefox
$menu = vicinae toggle
# Portapapeles: comando CORE de vicinae (clipboard:history). Los deeplinks
# vicinae://extensions/... son solo para extensiones de la store (dan
# "extension not found"). Probado en vivo con captura.
$clipMenu = vicinae cmd launch clipboard:history
$screenshot = ~/.config/hypr/scripts/screenshot.sh

# --- VARIABLES DE ENTORNO WAYLAND ---
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland
env = QT_QPA_PLATFORM,wayland;xcb
# Sin esto las apps Qt (Dolphin, pavucontrol) ignoran kdeglobals y salen en claro
env = QT_QPA_PLATFORMTHEME,kde
env = QT_STYLE_OVERRIDE,Breeze
env = QT_AUTO_SCREEN_SCALE_FACTOR,1
env = QT_WAYLAND_DISABLE_WINDOWDECORATION,1
env = GDK_BACKEND,wayland,x11,*

# --- CURSOR ---
env = XCURSOR_THEME,Breeze_Light
env = XCURSOR_SIZE,26

# --- AUTO-START DE SERVICIOS ---
# hyprpaper 0.8.4-6 NO lee su config en este sistema (verificado: un keyword
# invalido no produce error). Se sustituye por swaybg, que es un binario sin
# config: mas simple y fiable.  sudo pacman -S swaybg
exec-once = swaybg -m fill -i ~/.config/hypr/wallpapers/macos-1.png
exec-once = waybar
exec-once = swaync
# Vicinae corre como servidor: la ventana ya existe, el atajo solo la muestra
exec-once = vicinae server
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
# nm-applet se conserva: es el "secret agent" de NetworkManager y sin él
# las redes Wi-Fi nuevas pueden no pedir contraseña (Waybar no cubre esa función).
# nm-applet ELIMINADO: publica icono SNI aunque se le quite --indicator, y
# duplicaba el modulo network de Waybar. Coste: al conectarse a una Wi-Fi NUEVA
# ya no salta el aviso de contrasena. Usar el clic en el modulo de red
# (nm-connection-editor) o:  nmcli device wifi connect "SSID" password "clave"
# Las redes ya guardadas siguen conectandose solas.
# blueman-applet eliminado: duplicaba el módulo bluetooth de Waybar (bug #3, Fase 1).
exec-once = swayosd-server --top-margin 0.75
exec-once = hypridle

# --- ENTRADA (TECLADO Y TOUCHPAD) ---
input {
    kb_layout = latam
    kb_variant =
    kb_model =
    kb_options =
    kb_rules =

    follow_mouse = 1

    touchpad {
        natural_scroll = true
        tap-to-click = true
    }

    sensitivity = 0
}

# --- XWAYLAND ---
# La escala fraccional 1.2 estira las apps X11 (Spotify, JetBrains) y pixela
# el texto. force_zero_scaling: renderizan a 1x nativo (nítido) y cada app
# ajusta su propia escala (Spotify: ozone-wayland en spotify-launcher.conf;
# JetBrains: Settings > IDE Scale 120%).
xwayland {
    force_zero_scaling = true
}

# --- APARIENCIA GENERAL ---
general {
    gaps_in = $gaps_in
    gaps_out = $gaps_out
    border_size = 1
    col.active_border = $active_border_1 $active_border_2 45deg
    col.inactive_border = $inactive_border

    layout = dwindle
    resize_on_border = true
}

# --- DECORACIONES Y BLUR ---
decoration {
    rounding = $rounding
    
    # Ventanas OPACAS: nunca hay blur donde lees. Regla de Apple.
    active_opacity = 1.0
    inactive_opacity = 0.90

    # Este blur solo lo consumen las capas flotantes (rofi, swaync, wlogout,
    # hyprlock). Ajustado a "cristal esmerilado": radio alto y vibrancy, para
    # que se perciba luz y forma pero NUNCA se pueda leer lo de detras.
    blur {
        enabled = true
        size = 10
        passes = 3
        new_optimizations = true
        # ignore_opacity a false: con ventanas opacas, calcular blur detras de
        # ellas era GPU tirada a la basura (bateria).
        ignore_opacity = false
        xray = false
        noise = 0.025
        contrast = 1.05
        brightness = 0.85
        vibrancy = 0.35
        vibrancy_darkness = 0.2
    }

    shadow {
        enabled = true
        range = 14
        render_power = 3
        color = $shadow_color
    }
}

# --- ANIMACIONES FLUIDAS ---
animations {
    enabled = true

    bezier = wind, 0.05, 0.9, 0.1, 1.05
    bezier = winIn, 0.1, 1.05, 0.1, 1.0
    bezier = winOut, 0.3, -0.2, 0, 1
    bezier = liner, 1, 1, 1, 1

    animation = windows, 1, 4, wind, slide
    animation = windowsIn, 1, 4, winIn, slide
    animation = windowsOut, 1, 4, winOut, slide
    animation = border, 1, 1, liner
    # borderangle en loop infinito eliminado (bug #2, Fase 1): mantenía la GPU
    # siempre despierta, penalizando batería en portátil.
    animation = fade, 1, 4, default
    animation = workspaces, 1, 4, wind, slide
}

# --- LAYOUT DWINDLE ---
dwindle {
    preserve_split = true
}

# --- REGLAS DE VENTANAS Y CAPAS (sintaxis 0.56) ---
# ignore_alpha: el blur solo afecta a las islas, no al fondo transparente de la barra

# Vicinae (namespace verificado con hyprctl layers)
layerrule = blur = true, match:namespace = ^vicinae$
layerrule = ignore_alpha 0.2, match:namespace = ^vicinae$

# La barra es de CRISTAL: translucida + blur (asi es la referencia)
layerrule = blur = true, match:namespace = ^waybar$
layerrule = ignore_alpha 0.2, match:namespace = ^waybar$
layerrule = blur = true, match:namespace = ^swaync-control-center$
layerrule = blur = true, match:namespace = ^swaync-notification-window$
layerrule = ignore_alpha 0.3, match:namespace = ^swaync-control-center$
layerrule = ignore_alpha 0.3, match:namespace = ^swaync-notification-window$
layerrule = blur = true, match:namespace = ^wlogout$
layerrule = ignore_alpha 0.3, match:namespace = ^wlogout$

# OSD de swayosd (namespace verificado con hyprctl layers con el OSD visible)
layerrule = blur = true, match:namespace = ^swayosd$
layerrule = ignore_alpha 0.3, match:namespace = ^swayosd$

windowrule = float = true, match:class = ^(pavucontrol|blueman-manager|nm-connection-editor|org.kde.polkit-kde-authentication-agent-1)$
windowrule = center = true, match:class = ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = size 700 500, match:class = ^(pavucontrol|blueman-manager|nm-connection-editor)$
windowrule = opacity 1.0 override 1.0, match:class = ^(mpv|vlc|firefox|brave-browser)$

# --- ATAJOS DE TECLADO ---
$mainMod = SUPER

# Lanzadores
bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod SHIFT, RETURN, exec, $terminalAlt
bind = $mainMod, SPACE, exec, $menu
bind = $mainMod, B, exec, $browser
bind = $mainMod SHIFT, B, exec, $browserAlt
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, $clipMenu
bind = $mainMod, N, exec, swaync-client -t -sw
# Conmutador de temas ELIMINADO: sobreescribia los current.* generados y
# dejaba colores indefinidos en Waybar. Un solo tema, en theme/tokens.conf.
bind = $mainMod SHIFT, S, exec, $screenshot

# Gestión de Ventanas
bind = $mainMod, Q, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, togglefloating,
bind = $mainMod, P, pseudo,
bind = $mainMod, S, layoutmsg, togglesplit

# Foco entre ventanas (Flechas; vim-keys h/j/k/l eliminados a petición del usuario)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Mover ventanas dentro del mosaico (Flechas)
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Workspaces (1 al 6)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6

bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6

# Scroll entre Workspaces
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Control Multimedia y Brillo
bindel = , XF86AudioRaiseVolume, exec, swayosd-client --output-volume raise
bindel = , XF86AudioLowerVolume, exec, swayosd-client --output-volume lower
bindl = , XF86AudioMute, exec, swayosd-client --output-volume mute-toggle
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPrev, exec, playerctl previous

bindel = , XF86MonBrightnessUp, exec, swayosd-client --brightness raise
bindel = , XF86MonBrightnessDown, exec, swayosd-client --brightness lower

# Menú de sesión (logout, suspend, shutdown, reboot, lock)
bind = $mainMod SHIFT, E, exec, wlogout

# Bloqueo de pantalla: cierre de tapa (nombre verificado con hyprctl devices)
bindl = , switch:on:Lid Switch, exec, loginctl lock-session
# y con Super+L (decisión del usuario; vim-l eliminado, quedan flechas)
bind = $mainMod, L, exec, pidof hyprlock || hyprlock

# Mover y Redimensionar con Ratón
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
